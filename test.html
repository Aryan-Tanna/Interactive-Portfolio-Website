<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Folder Animation</title>
<style>
:root {
  --folder-color: #5227FF;
  --folder-back-color: #401FCC;
  --paper-1: #e6e6e6;
  --paper-2: #f2f2f2;
  --paper-3: #ffffff;
}

body {
  height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d1117;
}

.folder {
  position: relative;
  cursor: pointer;
  transition: transform 0.3s ease;
}

/* Hover lift when closed */
.folder:not(.open):hover {
  transform: translateY(-8px);
}

/* Folder back */
.folder__back {
  position: relative;
  width: 100px;
  height: 80px;
  background: var(--folder-back-color);
  border-radius: 0 10px 10px 10px;
  transition: all 0.3s ease;
}

.folder__back::after {
  content: "";
  position: absolute;
  bottom: 98%;
  left: 0;
  width: 30px;
  height: 10px;
  background: var(--folder-back-color);
  border-radius: 5px 5px 0 0;
}

/* Papers */
.paper {
  position: absolute;
  z-index: 2;
  bottom: 10%;
  left: 50%;
  width: 70%;
  height: 80%;
  border-radius: 10px;
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.3, 1);
  will-change: transform;
}

.paper:nth-child(1) {
  background: var(--paper-1);
}
.paper:nth-child(2) {
  background: var(--paper-2);
  width: 80%;
  height: 70%;
}
.paper:nth-child(3) {
  background: var(--paper-3);
  width: 90%;
  height: 60%;
}

/* Folder Fronts */
.folder__front {
  position: absolute;
  z-index: 3;
  width: 100%;
  height: 100%;
  background: var(--folder-color);
  border-radius: 5px 10px 10px 10px;
  transform-origin: bottom;
  transition: all 0.3s ease;
}
.folder__front.right {
  z-index: 4;
}

/* Closed hover */
.folder:not(.open):hover .folder__front {
  transform: skew(15deg) scaleY(0.6);
}
.folder:not(.open):hover .right {
  transform: skew(-15deg) scaleY(0.6);
}

/* OPEN STATE */
.folder.open {
  transform: translateY(-8px);
}

.folder.open .folder__front {
  transform: skew(15deg) scaleY(0.6);
}
.folder.open .right {
  transform: skew(-15deg) scaleY(0.6);
}

/* Paper transform positions when open */
.folder.open .paper:nth-child(1) {
  transform: translate(-120%, -70%) rotateZ(-15deg);
}
.folder.open .paper:nth-child(2) {
  transform: translate(10%, -70%) rotateZ(15deg);
}
.folder.open .paper:nth-child(3) {
  transform: translate(-50%, -100%) rotateZ(5deg);
}

/* 🔥 Correct Hover — only scales relative to its final position */
.folder.open .paper:nth-child(1):hover {
  transform: translate(-120%, -70%) rotateZ(-15deg) scale(1.1);
}
.folder.open .paper:nth-child(2):hover {
  transform: translate(10%, -70%) rotateZ(15deg) scale(1.1);
}
.folder.open .paper:nth-child(3):hover {
  transform: translate(-50%, -100%) rotateZ(5deg) scale(1.1);
}
</style>
</head>
<body>
  <div class="folder" id="folder">
    <div class="folder__back">
      <div class="paper"></div>
      <div class="paper"></div>
      <div class="paper"></div>
      <div class="folder__front"></div>
      <div class="folder__front right"></div>
    </div>
  </div>

<script>
const folder = document.getElementById('folder');
folder.addEventListener('click', () => folder.classList.toggle('open'));
</script>
</body>
</html>
